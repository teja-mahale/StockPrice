name: Fetch Equity Futures Data via cURL

on:
   repository_dispatch:
   #workflow_dispatch:

jobs:
  fetch-futures-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install kiteconnect pandas

      - name: Fetch Futures Data Using cURL
        id: future2
        env:
          KITE_API_KEY: ${{ secrets.API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          python history.py

      - name: Upload CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spot-futures-data
          path: kfintech_term_structure_full_6months.csv

      - name: Compare Futures Spreads
        id: future
        env:
          KITE_API_KEY: ${{ secrets.API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |

          ERROR_MESSAGE=""

          check_spread() {
            SYMBOL=$1
            NEAR_FUT=$2
            FAR_FUT=$3
            LOWER_LIMIT=$4
            UPPER_LIMIT=$5

            echo "Checking $SYMBOL"

            API_URL="https://api.kite.trade/quote/ltp?i=${NEAR_FUT}&i=${FAR_FUT}"

            RESPONSE=$(curl -s -X GET "$API_URL" \
              -H "X-Kite-Version: 3" \
              -H "Authorization: token $KITE_API_KEY:$KITE_ACCESS_TOKEN")

            echo "$SYMBOL Response: $RESPONSE"

            NEAR_PRICE=$(echo "$RESPONSE" | jq --arg sym "$NEAR_FUT" -r '.data[$sym].last_price')
            FAR_PRICE=$(echo "$RESPONSE" | jq --arg sym "$FAR_FUT" -r '.data[$sym].last_price')

            echo "$SYMBOL Near FUT Price: $NEAR_PRICE"
            echo "$SYMBOL Far FUT Price: $FAR_PRICE"

            if [[ "$NEAR_PRICE" == "null" || "$FAR_PRICE" == "null" || -z "$NEAR_PRICE" || -z "$FAR_PRICE" ]]; then
              ERROR_MESSAGE+="Failed to fetch prices for $SYMBOL\n"
              return
            fi

            DIFFERENCE=$(echo "$NEAR_PRICE - $FAR_PRICE" | bc -l)

            echo "$SYMBOL Spread: $DIFFERENCE"

            if (( $(echo "$DIFFERENCE <= $LOWER_LIMIT" | bc -l) )); then
              ERROR_MESSAGE+="🚨 $SYMBOL spread below threshold. Current: $DIFFERENCE | Limit: $LOWER_LIMIT\n"
            fi

            if (( $(echo "$DIFFERENCE >= $UPPER_LIMIT" | bc -l) )); then
              ERROR_MESSAGE+="🚨 $SYMBOL spread above threshold. Current: $DIFFERENCE | Limit: $UPPER_LIMIT\n"
            fi
          }

          declare -a FUTURES=(            
           
            "BDL|NFO:ASTRAL26AUGFUT|NFO:ASTRAL26SEPFUT|10|30"            
            "IREDA|NFO:IREDA26AUGFUT|NFO:IREDA26SEPFUT|2|5.50"           
            "LODHA|NFO:LODHA26AUGFUT|NFO:LODHA26SEPFUT|20|35"            
          )

          for FUT in "${FUTURES[@]}"; do
            IFS='|' read -r SYMBOL NEAR_FUT FAR_FUT LOWER_LIMIT UPPER_LIMIT <<< "$FUT"

            check_spread \
              "$SYMBOL" \
              "$NEAR_FUT" \
              "$FAR_FUT" \
              "$LOWER_LIMIT" \
              "$UPPER_LIMIT"
          done

          echo "ERROR_MESSAGE<<EOF" >> $GITHUB_ENV
          echo -e "$ERROR_MESSAGE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          if [[ -n "$ERROR_MESSAGE" ]]; then
            echo -e "$ERROR_MESSAGE"
            exit 1
          fi

      - name: Dispatch Slack notification
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "🚨 Futures Spread Alert",
              "attachments": [
                {
                  "color": "danger",
                  "title": "Spread Threshold Breached",
                  "fields": [
                    {
                      "title": "Alert Message",
                      "value": "${{ env.ERROR_MESSAGE }}",
                      "short": false
                    },
                    {
                      "title": "Workflow Run",
                      "value": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "short": false
                    }
                  ]
                }
              ]
            }
